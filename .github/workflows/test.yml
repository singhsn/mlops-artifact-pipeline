name: Test

on:
  push:
    branches: [test-branch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Pytest with PYTHONPATH
        run: |
          PYTHONPATH=. pytest -v
